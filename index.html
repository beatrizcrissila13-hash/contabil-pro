<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONTÁBIL PRO</title><style>body{font-family:system-ui;background:#0b1220;color:#e5eaf5;margin:0}header{background:#172238;padding:22px}main{max-width:1100px;margin:auto;padding:22px}h1{margin:0;color:#80dbcf}button,input{padding:12px;border-radius:8px;border:1px solid #53647c}button{cursor:pointer;background:#29b6a8;color:#081520;font-weight:bold}input{background:#1e2b42;color:white}section,.card{background:#172238;border-radius:12px;padding:18px;margin:12px 0}#layout{display:grid;grid-template-columns:1fr 2fr;gap:20px}#modules button,#lessons button{display:block;margin:8px 0;width:100%;text-align:left;background:#253753;color:white}#content{line-height:1.7}small{color:#b3c2d5}.hidden{display:none}@media(max-width:720px){#layout{grid-template-columns:1fr}}</style></head><body><header><h1>CONTÁBIL PRO</h1><small>Formação Contábil, Fiscal, Tributária e Financeira</small></header><main><section id="login"><h2>Acesso privado</h2><form id="form"><input id="email" type="email" placeholder="E-mail" required autocomplete="username"><input id="password" type="password" placeholder="Senha" required autocomplete="current-password"><button>Entrar</button></form><p id="error" role="alert"></p></section><section id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Minha formação</h2><button id="logout">Sair</button></div><p id="status"></p><div id="layout"><div><h3>Módulos</h3><div id="modules"></div></div><div><h3 id="moduleTitle">Escolha um módulo</h3><div id="lessons"></div><article id="content"></article></div></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://csfzgrcomcfpgjjwkopc.supabase.co','sb_publishable_kRE_Sn7rXj470B4r_CannQ_sM50XqWK');
const el=id=>document.getElementById(id);let user=null;
function show(s){user=s?.user??null;el('login').classList.toggle('hidden',!!user);el('app').classList.toggle('hidden',!user);if(user)loadModules();}
el('form').onsubmit=async e=>{e.preventDefault();el('error').textContent='Entrando...';const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});el('error').textContent=error?error.message:'';};
el('logout').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((_event,session)=>show(session));db.auth.getSession().then(({data})=>show(data.session));
async function loadModules(){const {data,error}=await db.from('modules').select('id,code,title,phase,position').eq('published',true).order('position');el('status').textContent=error?'Erro ao carregar módulos: '+error.message:(data?.length??0)+' módulos disponíveis';el('modules').replaceChildren();for(const m of data??[]){const b=document.createElement('button');b.textContent=m.code+' · '+m.title;b.onclick=()=>loadLessons(m);el('modules').append(b)}}
async function loadLessons(m){el('moduleTitle').textContent=m.title;el('content').replaceChildren();const {data,error}=await db.from('lessons').select('id,title,position,content').eq('module_id',m.id).eq('published',true).order('position');el('lessons').replaceChildren();if(error){el('lessons').textContent=error.message;return}for(const l of data??[]){const b=document.createElement('button');b.textContent=l.position+'. '+l.title;b.onclick=()=>showLesson(l);el('lessons').append(b)}}
function showLesson(l){const c=l.content||{};const a=el('content');a.replaceChildren();const h=document.createElement('h2');h.textContent=l.title;a.append(h);for(const [key,label] of [['objective','Objetivo'],['introduction','Introdução'],['theory','Teoria'],['worked_example','Exemplo resolvido'],['practice','Prática'],['answer_explanation','Resposta comentada'],['answer_guidance','Orientação'],['disclaimer','Situação do material']]){if(c[key]){const sec=document.createElement('section');const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=c[key];sec.append(h,p);a.append(sec)}}for(const key of ['study_steps','review']){if(Array.isArray(c[key])){const sec=document.createElement('section');const h=document.createElement('h3');h.textContent=key==='review'?'Revisão':'Etapas de estudo';sec.append(h);const ol=document.createElement('ol');for(const item of c[key]){const li=document.createElement('li');li.textContent=item;ol.append(li)}sec.append(ol);a.append(sec)}}const b=document.createElement('button');b.textContent='Marcar aula como concluída';b.onclick=async()=>{const {error}=await db.from('lesson_progress').upsert({user_id:user.id,lesson_id:l.id,status:'completed',completed_at:new Date().toISOString()},{onConflict:'user_id,lesson_id'});alert(error?'Não foi possível salvar: '+error.message:'Progresso registrado!')};a.append(b)}
</script></body></html>
