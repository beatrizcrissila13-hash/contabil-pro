name: Validate application JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attrs = dict(attrs)
                      self.inside = 'src' not in attrs and attrs.get('type', 'text/javascript') in ('text/javascript', 'module')
                      if self.inside:
                          self.scripts.append('')
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts[-1] += data
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('No inline application JavaScript found')
          for i, script in enumerate(parser.scripts):
              Path(f'/tmp/contabil-pro-inline-{i}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline script(s)')
          PY
          for file in /tmp/contabil-pro-inline-*.js; do
            node --check "$file"
          done
      - name: Verify critical learning flows are wired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = {
              'guided lessons': 'guided_course_v2',
              'lesson navigation': 'openLesson(',
              'diagnostic history': "from('guided_diagnostic_attempts')",
              'private chapter progress': "worksheet_key:'chapter_progress_v1'",
              'private posting worksheet': "worksheet_key:'accounts_payable_posting_v1'",
              'financial grading': "grade_financial_unit_numeric",
              'server-graded AP diagnostic': "rpc('submit_ap_diagnostic'",
              'diagnostic result renderer': 'const showResult=(answers,restored)=>',
              'chapter save retry control': 'Tentar salvar progresso novamente',
              'chapter save network error handling': "error={message:err?.message||'Erro de conexão'}",
              'chapter progress persistence': "onConflict:'user_id,lesson_id,worksheet_key'",
          }
          missing = [name for name, marker in required.items() if marker not in html]
          if missing:
              raise SystemExit('Missing learning features: ' + ', '.join(missing))
          if 'const {data:rows,error}=await refreshHistory()' in html:
              raise SystemExit('Diagnostic history recursively calls itself')
          print('Critical learning feature markers verified')
          PY
